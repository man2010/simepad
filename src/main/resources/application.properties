spring.application.name=simepad
# OpenAI is optional; configure it only when enabling the cognitive adapter.
spring.autoconfigure.exclude=org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/simepad}
spring.datasource.username=${DB_USERNAME:simepad}
spring.datasource.password=${DB_PASSWORD:simepad}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Flyway owns schema changes; keep Hibernate from creating tables implicitly.
spring.flyway.enabled=true

# Open-Meteo weather API (free for non-commercial use, no API key).
simepad.datasources.open-meteo.base-url=${OPEN_METEO_BASE_URL:https://api.open-meteo.com/v1/forecast}
simepad.datasources.open-meteo-marine.base-url=${OPEN_METEO_MARINE_BASE_URL:https://marine-api.open-meteo.com/v1/marine}

# Periodic collection is opt-in; manual API calls remain available when disabled.
simepad.collection.schedule.enabled=${SIMEPAD_COLLECTION_SCHEDULE_ENABLED:false}
simepad.collection.schedule.initial-delay-ms=${SIMEPAD_COLLECTION_INITIAL_DELAY_MS:3600000}
simepad.collection.schedule.fixed-delay-ms=${SIMEPAD_COLLECTION_FIXED_DELAY_MS:3600000}
